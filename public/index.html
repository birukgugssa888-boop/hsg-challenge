* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif; }
body { background: radial-gradient(circle at 20% 20%, #0a0f1e, #03060b); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1.5rem; }
.challenge-card { max-width: 1200px; width: 100%; background: linear-gradient(145deg, #0b111f, #0a0e17); border: 2px solid #1e90ff; border-radius: 36px; box-shadow: 0 0 40px rgba(0,160,255,0.4), inset 0 0 40px rgba(0,100,255,0.2); padding: 2rem; position: relative; overflow: hidden; }
.challenge-card::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; position: relative; z-index: 3; }
.logo-area { display: flex; align-items: center; gap: 1rem; }
.logo-badge { background: #001d3d; border: 2px solid #4df0ff; border-radius: 16px; padding: 0.5rem 1rem; font-weight: 800; font-size: 2rem; color: #b3f0ff; text-shadow: 0 0 12px #00d4ff; }
.logo-text h1 { font-size: 2rem; font-weight: 800; color: #fff; text-shadow: 0 0 12px #00a6ff; }
.logo-text p { color: #7ec8e3; font-size: 0.85rem; margin-top: 0.2rem; }
.user-badge { color: #7df9ff; background: #001d3d; border: 1px solid #2f8fff; border-radius: 20px; padding: 0.4rem 0.9rem; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
.user-badge button { background: transparent; border: none; color: #ff7b7b; cursor: pointer; font-weight: 600; }
.main-title { text-align: center; margin-bottom: 1.5rem; position: relative; z-index: 3; }
.main-title h2 { font-size: 2.6rem; font-weight: 800; background: linear-gradient(135deg, #b0e0ff, #7df9ff, #4d9eff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; }
.main-title .sub { font-size: 1rem; color: #9ad0ff; letter-spacing: 4px; margin-top: -0.2rem; text-transform: uppercase; }
.auth-wrapper { position: relative; z-index: 3; max-width: 440px; margin: 2rem auto; }
.auth-panel { background: #0b1424cc; border: 1.5px solid #2f7fbf; border-radius: 28px; padding: 2rem; backdrop-filter: blur(8px); }
.auth-panel h3 { color: #c2e4ff; text-align: center; margin-bottom: 0.4rem; letter-spacing: 1px; }
.auth-panel .subtitle { color: #7ec8e3; text-align: center; font-size: 0.85rem; margin-bottom: 1.4rem; }
.auth-panel input { width: 100%; background: #0a1625; border: 1.5px solid #1e6f9f; border-radius: 40px; padding: 0.9rem 1.2rem; color: #e0f0ff; margin-bottom: 0.9rem; outline: none; font-size: 0.95rem; }
.auth-panel input:focus { border-color: #4df0ff; box-shadow: 0 0 18px #00a6ff55; }
.auth-panel button { width: 100%; background: linear-gradient(145deg, #0f2b44, #0a1f33); border: 1.5px solid #2f8fff; border-radius: 40px; padding: 0.9rem; color: #b0e0ff; font-weight: 700; cursor: pointer; font-size: 1rem; letter-spacing: 1px; transition: 0.2s; }
.auth-panel button:hover { background: #123a5a; border-color: #7df9ff; color: #fff; }
.auth-panel button:disabled { opacity: 0.5; cursor: not-allowed; }
.auth-msg { margin-top: 0.9rem; text-align: center; font-size: 0.85rem; min-height: 1.3rem; }
.auth-msg.error { color: #ff7b7b; }
.auth-msg.success { color: #4dff88; }
.days-tracker { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; margin-bottom: 1.8rem; position: relative; z-index: 3; }
.day-card { background: #0b1424cc; border: 1.5px solid #2f7fbf; border-radius: 20px; padding: 1rem 0.8rem; text-align: center; backdrop-filter: blur(6px); cursor: pointer; transition: 0.2s; }
.day-card.active { border-color: #4df0ff; box-shadow: 0 0 25px #00a6ff66; }
.day-card.completed { border-color: #4dff88; box-shadow: 0 0 20px #4dff8833; }
.day-card.upcoming { opacity: 0.65; cursor: not-allowed; }
.day-card:hover:not(.upcoming) { transform: translateY(-3px); }
